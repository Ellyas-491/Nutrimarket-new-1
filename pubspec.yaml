name: clev_ai
description: NutriMarket - Mobile Marketplace Makanan Sehat & Asisten Nutrisi AI
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.5
  http: ^1.2.2
  flutter_dotenv: ^5.2.1
  cupertino_icons: ^1.0.8
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  url_launcher: 6.2.5
  flutter_markdown: ^0.7.3
  geolocator: ^13.0.2
  supabase_flutter: ^2.8.0
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/